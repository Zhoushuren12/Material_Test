[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-test"
version = "0.1.0"
description = "Python-first OpenSees material testing and manual fitting tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pyqtgraph",
    "pandas",
    "openpyxl",
    "PyYAML",
    "PySide6",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
material-test = "material_test.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["material_test*"]

[tool.setuptools.package-data]
material_test = ["resources/*.yaml"]
