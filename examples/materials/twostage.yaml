name: TwoStage
description: Current custom TwoStage material used by the original red-curve script.
command: "uniaxialMaterial TwoStage {tag} {f1} {k1} {kp1} {f2} {k2} {kp2} {ua}"
tag: 1
parameters:
  - name: f1
    value: 270.0
    min: 0.0
  - name: k1
    value: 45.0
    min: 0.0
  - name: kp1
    value: 0.25
  - name: f2
    value: 220.0
    min: 0.0
  - name: k2
    value: 24.0
    min: 0.0
  - name: kp2
    value: 0.20
  - name: ua
    value: 24.0
    min: 0.0
